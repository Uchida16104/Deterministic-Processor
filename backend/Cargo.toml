[package]
name = "deterministic-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
tokio = { version = "1.35", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
libloading = "0.8"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
